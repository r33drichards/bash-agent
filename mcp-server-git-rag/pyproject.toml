[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-git-rag"
version = "0.1.0"
description = "MCP server for Git repository RAG (Retrieval Augmented Generation) queries"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "bash-agent contributors" }
]
dependencies = [
    "mcp>=1.0.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-chroma>=0.1.0",
    "langchain-core>=0.1.0",
    "chromadb>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mcp-server-git-rag = "mcp_server_git_rag.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_git_rag"]
